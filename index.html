<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--surface:#f4f4f5;--line:#e4e4e7;--text:#111113;--sub:#6b6b73;--accent:#3d6bff;--accent-text:#2a55e6;--on-accent:#fff;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e10;--surface:#1a1a1d;--line:#2a2a2e;--text:#f4f4f5;--sub:#9a9aa3;--accent-text:#8ba6ff;--ok:#4ade80}}
:root[data-theme=dark]{--bg:#0e0e10;--surface:#1a1a1d;--line:#2a2a2e;--text:#f4f4f5;--sub:#9a9aa3;--accent-text:#8ba6ff;--ok:#4ade80}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:16px 16px 24px}
#view.in{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#dock{flex:none;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#dock:empty{display:none}

h1{font-size:26px;line-height:1.2;font-weight:700}
.eyebrow,.sub{font-size:13px;color:var(--sub)}
.sub{display:block}
.head{margin-bottom:20px}
.grow{flex:1;min-width:0}
.icon{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);flex:none}
.back{margin:-8px 0 4px -12px}

/* home */
.wcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px;margin-bottom:12px;border-radius:20px;background:var(--surface);transition:opacity .15s}
.wcard:active{opacity:.7}
.wt{display:block;font-weight:600;font-size:17px}
.chip{font-size:12px;font-weight:600;color:var(--accent-text);margin-left:6px}
.rules{margin-top:20px;font-size:15px}
.rules summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}.rules summary::after{content:"+";color:var(--sub);font-size:20px}.rules[open] summary::after{content:"−"}
.rules ul{padding-left:20px;color:var(--sub)}
.rules li{margin-bottom:6px}

/* workout list */
.note{background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--sub);margin-bottom:16px}
.ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line);min-height:72px}
.ex:active{opacity:.6}
.thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--surface);flex:none}
.thumb.warm{display:grid;place-items:center;color:var(--accent-text)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ex .nm{display:block;font-weight:600}
.cnt{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px;display:flex;align-items:center;gap:4px}
.cnt.ok{color:var(--ok)}

/* exercise */
.frames{position:relative;aspect-ratio:3/2;background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:16px}
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frames img+img{animation:swap 2.4s ease-in-out infinite}
@keyframes swap{0%,40%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
.wlist{padding-left:20px;margin:8px 0;color:var(--sub)}
.hint{background:var(--surface);border-radius:16px;padding:12px 16px;margin:16px 0;font-size:15px}
.hint b{color:var(--accent-text)}
.sets{display:grid;gap:8px;margin-bottom:16px}
.set{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 0 0 14px;border-radius:12px;border:1px solid var(--line);color:var(--sub);font-variant-numeric:tabular-nums}
.set .n{width:16px}
.set.done{color:var(--text);font-weight:600}
.set.done .ck{color:var(--ok);display:flex}
.set.now{border-color:var(--accent);color:var(--text)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.stepper{display:flex;align-items:center;background:var(--surface);border-radius:16px;height:64px}
.stepper button{width:44px;height:64px;display:grid;place-items:center;color:var(--accent-text);flex:none}
.stepper button:active{opacity:.5}
.stepper input{width:100%;min-width:0;text-align:center;font:inherit;font-size:24px;font-weight:700;background:none;border:0;color:inherit;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text)}
.seglabel{font-size:13px;color:var(--sub);margin-bottom:6px}

/* dock */
.bar{display:flex;gap:8px;padding:12px 16px}
.btn{flex:1;height:52px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.ghost{flex:none;background:var(--surface);color:var(--text)}
.tabs{display:flex}
.tabs button{flex:1;min-height:56px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--sub)}
.tabs button[aria-current=page]{color:var(--accent-text)}
.rest{padding:12px 16px 0}
.rt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.time{font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.rbtns{display:flex;gap:4px}
.rbtns button{min-width:48px;height:44px;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;display:grid;place-items:center}
.prog{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.rest.done .time{color:var(--ok)}
.rest.done .prog i{background:var(--ok)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.day{border-top:1px solid var(--line);padding:16px 0}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dh b{font-size:17px}
.dr{padding:6px 0}
.dr .l{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.dr .s{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.d.up{color:var(--ok)}
h2{font-size:18px;font-weight:700;margin:24px 0 8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:14px;border:1px solid var(--line);color:var(--sub);font-weight:600}
.pill .pk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.pill .pk svg{width:14px;height:14px}
.pill.ok{color:var(--text);border-color:var(--ok)}
.pill.ok .pk{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.pc{padding:14px 0;border-top:1px solid var(--line)}
.pc .nm{font-weight:600}
.pl{display:flex;align-items:center;gap:12px}
.sp{color:var(--accent-text);flex:none;display:flex}
.pc.up .sp{color:var(--ok)}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pc.up .bar2 i{background:var(--ok)}
.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;border:1px solid var(--ok);color:var(--ok);font-size:13px;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:48px 0}

@media (prefers-reduced-motion:reduce){#view.in{animation:none}.frames img+img{animation:none;opacity:0}*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main><footer id="dock"></footer></div>
<script>
const tg = window.Telegram?.WebApp;
const inTg = !!tg?.initData;
const $ = s => document.querySelector(s);

/* ---------- данные программы ---------- */
const EX = {
  legpress: {n:'Жим ногами',            g:'Ноги',   img:'Leg_Press',              sets:3, r:[10,12], step:5,   note:'В тренажёре (Leg Press). Не нагружает спину, даёт отличную базу ногам.'},
  dbpress:  {n:'Жим гантелей лёжа',     g:'Грудь',  img:'Dumbbell_Bench_Press',   sets:3, r:[8,10],  step:2,   note:'На горизонтальной скамье. Работают грудь и трицепс.'},
  pulldown: {n:'Тяга верхнего блока',   g:'Спина',  img:'Wide-Grip_Lat_Pulldown', sets:3, r:[10,12], step:2.5, note:'К груди (Lat Pulldown). Формирует широкую спину.'},
  shoulder: {n:'Жим гантелей сидя',     g:'Плечи',  img:'Dumbbell_Shoulder_Press',sets:3, r:[10,10], step:2,   note:'Вверх (Shoulder Press). Качает плечи.'},
  abs:      {n:'Скручивания',           g:'Пресс',  img:'Crunches',               sets:3, r:[15,20], step:1,   note:'Любые скручивания на пресс. Вес — только если добавляешь отягощение.'},
  legcurl:  {n:'Сгибания ног',          g:'Ноги',   img:'Seated_Leg_Curl',        sets:3, r:[12,12], step:2.5, note:'Сидя или лёжа (Leg Curls). Задняя поверхность бедра.'},
  incline:  {n:'Жим на наклонной',      g:'Грудь',  img:'Incline_Dumbbell_Press', sets:3, r:[8,10],  step:2,   note:'Гантели или штанга (Incline Press). Верхняя часть груди.'},
  row:      {n:'Тяга нижнего блока',    g:'Спина',  img:'Seated_Cable_Rows',      sets:3, r:[10,12], step:2.5, note:'К поясу сидя (Seated Cable Row). Толщина спины и осанка.'},
  lateral:  {n:'Махи гантелями в стороны', g:'Плечи', img:'Side_Lateral_Raise',   sets:3, r:[12,15], step:1,   note:'Стоя (Lateral Raises). Делает плечи визуально шире.'},
  biceps:   {n:'Подъём на бицепс',      g:'Бицепс', img:'Dumbbell_Bicep_Curl',    sets:3, r:[10,12], step:1,   note:'Гантели или штанга.'},
};
const DAYS = {
  A: {title:'Понедельник', ex:['legpress','dbpress','pulldown','shoulder','abs']},
  B: {title:'Пятница', ex:['legcurl','incline','row','lateral','biceps']},
};
const RESTS = [120,150,180];

/* ---------- хранилище: Telegram CloudStorage + localStorage-кэш ---------- */
const cloud = inTg && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const call = (m, ...a) => new Promise((ok, no) => cloud[m](...a, (e, v) => e ? no(e) : ok(v)));
const lsGet = k => { try { return localStorage.getItem('wt:' + k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem('wt:' + k) : localStorage.setItem('wt:' + k, v); } catch {} };

const db = {s: {}, prefs: {rest: 150}};

async function load() {
  let all = {};
  try {
    if (cloud) {
      const keys = await call('getKeys');
      for (let i = 0; i < keys.length; i += 40) Object.assign(all, await call('getItems', keys.slice(i, i + 40)));
      for (const k in all) lsSet(k, all[k]);
    }
  } catch { all = {}; }
  if (!Object.keys(all).length) {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('wt:')) all[k.slice(3)] = localStorage.getItem(k);
      }
    } catch {}
  }
  for (const [k, v] of Object.entries(all)) {
    try {
      if (k === 'prefs') Object.assign(db.prefs, JSON.parse(v));
      else if (k.startsWith('s:')) db.s[k] = JSON.parse(v);
    } catch {}
  }
}

function save(k, v) {
  const s = v == null ? null : JSON.stringify(v);
  lsSet(k, s);
  if (cloud) (s == null ? call('removeItem', k) : call('setItem', k, s)).catch(() => {});
}

/* ---------- утилиты ---------- */
const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => iso(new Date());
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString('ru-RU', {weekday: 'short', day: 'numeric', month: 'short'});
const fmt = n => String(Math.round(n * 100) / 100);
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const rng = e => e.r[0] === e.r[1] ? e.r[0] : `${e.r[0]}–${e.r[1]}`;
const setTxt = ([w, r]) => w ? `${fmt(w)}×${r}` : `${r}`;
const hap = t => tg?.HapticFeedback?.impactOccurred(t);

const svg = p => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic = {
  left: svg('<path d="m15 18-6-6 6-6"/>'),
  right: svg('<path d="m9 18 6-6-6-6"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  minus: svg('<path d="M5 12h14"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  dumb: svg('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),
  timer: svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>'),
  chart: svg('<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>'),
};

/* ---------- сессии и прогрессия ---------- */
const allSess = () => Object.values(db.s).sort((a, b) => b.date.localeCompare(a.date));
const sessKey = (date, day) => `s:${date}:${day}`;
const todaySets = (day, id) => db.s[sessKey(today(), day)]?.ex[id] || [];
const lastFor = id => allSess().find(s => s.date < today() && s.ex[id]?.length)?.ex[id];

// план на подход i по прошлой тренировке: все подходы на максимуме повторений → +вес
function plan(id, i) {
  const e = EX[id], last = lastFor(id);
  if (!last) return {last: null, w: 0, r: e.r[0]};
  const w = last[last.length - 1][0];
  if (last.length >= e.sets && last.every(x => x[1] >= e.r[1])) return {last, up: true, w: w + e.step, r: e.r[0]};
  return {last, w, r: Math.min(e.r[1], (last[i] || last[last.length - 1])[1] + 1)};
}
function suggest(day, id) {
  const cur = todaySets(day, id);
  if (cur.length) return {w: cur.at(-1)[0], r: cur.at(-1)[1]};
  const p = plan(id, 0);
  return {w: p.w, r: p.r};
}
function best(sets) {
  const w = Math.max(...sets.map(x => x[0]));
  return {w, reps: sets.filter(x => x[0] === w).reduce((a, x) => a + x[1], 0)};
}
function delta(date, id, sets) {
  const prev = allSess().find(s => s.date < date && s.ex[id]);
  if (!prev) return '';
  const a = best(sets), b = best(prev.ex[id]);
  if (a.w !== b.w) return `<span class="d ${a.w > b.w ? 'up' : ''}">${a.w > b.w ? '+' : '−'}${fmt(Math.abs(a.w - b.w))} кг</span>`;
  if (a.reps !== b.reps) return `<span class="d ${a.reps > b.reps ? 'up' : ''}">${a.reps > b.reps ? '+' : '−'}${Math.abs(a.reps - b.reps)} повт.</span>`;
  return '<span class="d">=</span>';
}

/* ---------- лестница до повышения веса ---------- */
function ladder(id, sets) {
  const e = EX[id], sum = sets.reduce((a, x) => a + x[1], 0), lo = e.sets * e.r[0], hi = e.sets * e.r[1];
  const up = sets.length >= e.sets && sets.every(x => x[1] >= e.r[1]);
  const pct = up ? 1 : hi > lo ? Math.max(0, Math.min(1, (sum - lo) / (hi - lo))) : Math.min(1, sum / hi);
  return {up, pct, left: Math.max(0, hi - sum)};
}
const ladderHtml = (id, sets) => {
  const l = ladder(id, sets);
  return `<div class="bar2"><i style="width:${Math.round(l.pct * 100)}%"></i></div>
    <div class="sub">${l.up ? 'Все подходы на максимуме — пора добавить вес' : `Ещё ${l.left} повт. до повышения веса`}</div>`;
};
function spark(vals) {
  if (vals.length < 2) return '';
  const W = 72, H = 28, mn = Math.min(...vals), mx = Math.max(...vals);
  const y = v => mx === mn ? H / 2 : H - 2 - (v - mn) / (mx - mn) * (H - 4);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (W - 4) + 2).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Динамика нагрузки"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const weekStart = d => { const m = new Date(d); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return iso(m); };

/* ---------- таймер отдыха ---------- */
let rest = null, ac = null;
try { rest = JSON.parse(lsGet('rest')); } catch {}
if (rest && Date.now() - rest.end > 600000) rest = null;
const saveRest = () => lsSet('rest', rest && JSON.stringify(rest));

function startRest(sec = db.prefs.rest, label = 'Отдых') {
  const t = sec * 1000;
  rest = {end: Date.now() + t, total: t, done: false, label};
  saveRest();
}
function ding() {
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; g.gain.value = .15;
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .15);
    });
  } catch {}
  tg?.HapticFeedback?.notificationOccurred('success');
  navigator.vibrate?.([200, 100, 200]);
}
function tick() {
  if (!rest) return;
  const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
  if (left === 0 && !rest.done) { rest.done = true; saveRest(); ding(); }
  $('#rtime') && ($('#rtime').textContent = mmss(left));
  $('#rl') && ($('#rl').textContent = rest.done ? (rest.label === 'Разминка' ? 'Разминка готова' : 'Пора работать') : rest.label);
  $('#rest')?.classList.toggle('done', rest.done);
  $('#rbar') && ($('#rbar').style.transform = `scaleX(${Math.min(1, 1 - (rest.end - Date.now()) / rest.total)})`);
}
const timerHtml = () => !rest ? '' : `
  <div class="rest" id="rest" role="timer">
    <div class="rt">
      <div><div class="sub" id="rl">${rest.label || 'Отдых'}</div><div class="time" id="rtime">0:00</div></div>
      <div class="rbtns">
        <button data-a="rest" data-d="-15" aria-label="Минус 15 секунд">−15</button>
        <button data-a="rest" data-d="15" aria-label="Плюс 15 секунд">+15</button>
        <button data-a="skip" aria-label="Закрыть таймер">${ic.x}</button>
      </div>
    </div>
    <div class="prog"><i id="rbar"></i></div>
  </div>`;

/* ---------- навигация ---------- */
let nav = [{v: 'home'}];
const here = () => nav[nav.length - 1];
const ui = {cur: {w: 0, r: 0}};
const go = (v, p = {}) => { nav.push({v, ...p}); render(); };
const back = () => { if (nav.length > 1) { nav.pop(); render(); } };
const tab = v => { nav = [{v}]; render(); };
function openEx(day, id, replace) {
  ui.cur = suggest(day, id);
  if (replace) { nav[nav.length - 1] = {v: 'ex', day, id}; render(); } else go('ex', {day, id});
}

/* ---------- экраны ---------- */
const tabsHtml = cur => `<nav class="tabs">
  <button data-a="tab" data-v="home" ${cur === 'home' ? 'aria-current="page"' : ''}>${ic.dumb}<span>Тренировки</span></button>
  <button data-a="tab" data-v="progress" ${cur === 'progress' ? 'aria-current="page"' : ''}>${ic.chart}<span>Прогресс</span></button>
</nav>`;
const backBtn = () => inTg ? '' : `<button class="icon back" data-a="back" aria-label="Назад">${ic.left}</button>`;

const V = {};

V.home = () => {
  const dow = new Date().getDay(), sug = dow === 1 ? 'A' : dow === 5 ? 'B' : null;
  const cards = Object.entries(DAYS).map(([k, d]) => {
    const last = allSess().find(s => s.day === k);
    return `<button class="wcard" data-a="day" data-day="${k}">
      <span class="grow"><span class="wt">${d.title}${k === sug ? '<span class="chip">Сегодня</span>' : ''}</span>
        <span class="sub">Разминка + ${d.ex.length} упражнений</span>
        <span class="sub">${last ? 'Последняя: ' + fmtDate(last.date) : 'Ещё не было'}</span></span>
      ${ic.right}</button>`;
  }).join('');
  return [`<div class="head"><div class="eyebrow">${fmtDate(today())}</div><h1>Тренировки</h1></div>${cards}
    <details class="rules"><summary>Правила в зале</summary><ul>
      <li>Разминка: 5 минут суставной гимнастики + 1–2 лёгких подхода перед первым упражнением.</li>
      <li>Отдых между подходами 2–3 минуты, без спешки. Вся тренировка — 45–50 минут.</li>
      <li>Прогрессия: возьми вес, с которым выходит 3×8. Каждую неделю добавляй по повторению. Когда все три подхода на максимуме — увеличь вес и начни заново.</li>
    </ul></details>`, tabsHtml('home')];
};

V.workout = ({day}) => {
  const d = DAYS[day];
  const rows = d.ex.map(id => {
    const e = EX[id], n = todaySets(day, id).length, ok = n >= e.sets;
    return `<button class="ex" data-a="ex" data-day="${day}" data-id="${id}">
      <span class="thumb"><img src="img/${e.img}-0.jpg" alt="" loading="lazy"></span>
      <span class="grow"><span class="nm">${e.n}</span><span class="sub">${e.sets} × ${rng(e)} · ${e.g}</span></span>
      <span class="cnt ${ok ? 'ok' : ''}">${ok ? ic.check : n + '/' + e.sets}</span></button>`;
  }).join('');
  const warm = `<button class="ex" data-a="warm" data-day="${day}">
      <span class="thumb warm">${ic.timer}</span>
      <span class="grow"><span class="nm">Разминка</span><span class="sub">5 минут · суставная гимнастика</span></span>${ic.right}</button>`;
  return [`${backBtn()}<div class="head"><h1>${d.title}</h1></div>${warm}${rows}`, ''];
};

V.warmup = ({day}) => [`${backBtn()}
  <div class="head"><div class="eyebrow">${DAYS[day].title}</div><h1>Разминка</h1></div>
  <p>5 минут суставной гимнастики:</p>
  <ul class="wlist"><li>Покрути руками и плечами</li><li>Покрути коленями и тазом</li><li>Наклоны и повороты корпуса</li></ul>
  <p class="sub" style="margin:12px 0 20px">Перед первым упражнением сделай 1–2 разминочных подхода с очень лёгким весом.</p>
  <button class="btn" style="width:100%" data-a="startwarm">${ic.timer}Запустить таймер 5:00</button>`,
  `<div class="bar"><button class="btn" data-a="next">К упражнениям${ic.right}</button></div>`];

V.ex = ({day, id}) => {
  const e = EX[id], list = DAYS[day].ex, idx = list.indexOf(id), cur = todaySets(day, id);
  const p = plan(id, cur.length);
  const hint = !p.last
    ? `Первый раз: подбери вес, с которым выйдет ${e.sets}×${e.r[0]}.`
    : `Прошлый раз: ${p.last.map(setTxt).join(' · ')}<br>${p.up
        ? `<b>Пора добавить вес: ${fmt(p.w)} кг × ${p.r}</b>`
        : `Цель: <b>${p.w ? fmt(p.w) + ' кг × ' : ''}${p.r} повт.</b>`}${ladderHtml(id, p.last)}`;
  let sets = '';
  for (let i = 0; i < Math.max(e.sets, cur.length); i++) {
    sets += cur[i]
      ? `<div class="set done"><span class="ck">${ic.check}</span><span class="grow">${cur[i][0] ? fmt(cur[i][0]) + ' кг × ' + cur[i][1] : cur[i][1] + ' повт.'}</span>
         <button class="icon" data-a="del" data-i="${i}" aria-label="Удалить подход ${i + 1}">${ic.x}</button></div>`
      : `<div class="set ${i === cur.length ? 'now' : ''}"><span class="n">${i + 1}</span><span class="grow">${i === cur.length ? 'Текущий подход' : '—'}</span></div>`;
  }
  const reached = cur.length >= e.sets, last = idx === list.length - 1;
  const stepper = (k, label, v) => `<div class="field"><label for="in-${k}">${label}</label><div class="stepper">
    <button data-a="step" data-k="${k}" data-d="-1" aria-label="Меньше: ${label}">${ic.minus}</button>
    <input id="in-${k}" data-in="${k}" inputmode="decimal" value="${fmt(v || 0)}">
    <button data-a="step" data-k="${k}" data-d="1" aria-label="Больше: ${label}">${ic.plus}</button></div></div>`;
  const bar = reached
    ? `<div class="bar"><button class="btn ghost" data-a="log">Ещё подход</button>
       <button class="btn" data-a="next">${last ? 'Завершить' : 'Дальше'}${ic.right}</button></div>`
    : `<div class="bar"><button class="btn" data-a="log">Записать подход ${cur.length + 1} из ${e.sets}</button></div>`;
  return [`${backBtn()}
    <div class="frames"><img src="img/${e.img}-0.jpg" alt="${e.n}: начало движения"><img src="img/${e.img}-1.jpg" alt="${e.n}: конец движения"></div>
    <h1>${e.n}</h1>
    <div class="sub">${e.sets} × ${rng(e)} повторений · ${e.g}</div>
    <p class="sub" style="margin-top:4px">${e.note}</p>
    <div class="hint">${hint}</div>
    <div class="sets">${sets}</div>
    <div class="steps">${stepper('w', e.g === 'Пресс' ? 'Доп. вес, кг' : 'Вес, кг', ui.cur.w)}${stepper('r', 'Повторы', ui.cur.r)}</div>
    <div class="seglabel">Отдых между подходами</div>
    <div class="seg">${RESTS.map(s => `<button data-a="pref" data-s="${s}" aria-pressed="${db.prefs.rest === s}">${mmss(s)}</button>`).join('')}</div>`, bar];
};

V.progress = () => {
  const ss = allSess(), wk = weekStart(new Date());
  const weeks = new Set(ss.map(s => weekStart(s.date + 'T12:00')));
  let streak = 0;
  const w = new Date(wk + 'T12:00');
  if (!weeks.has(wk)) w.setDate(w.getDate() - 7);
  while (weeks.has(iso(w))) { streak++; w.setDate(w.getDate() - 7); }
  const pills = Object.entries(DAYS).map(([k, d]) => {
    const ok = ss.some(s => s.day === k && s.date >= wk);
    return `<div class="pill ${ok ? 'ok' : ''}"><span class="pk">${ok ? ic.check : ''}</span>${d.title}</div>`;
  }).join('');
  const cards = [...DAYS.A.ex, ...DAYS.B.ex].map(id => {
    const e = EX[id], hist = ss.filter(s => s.ex[id]).reverse();
    if (!hist.length) return `<div class="pc"><div class="nm">${e.n}</div><div class="sub">Ещё нет данных</div></div>`;
    const sets = (hist.filter(s => s.ex[id].length >= e.sets).at(-1) || hist.at(-1)).ex[id];
    const l = ladder(id, sets), wt = sets.at(-1)[0];
    const load = hist.map(s => s.ex[id].reduce((a, [x, r]) => a + (x || 1) * r, 0));
    return `<div class="pc ${l.up ? 'up' : ''}">
      <div class="pl"><div class="grow"><div class="nm">${e.n}</div>
        <div class="sub">${wt ? fmt(wt) + ' кг · ' : ''}${sets.map(x => x[1]).join(' / ')} повт.</div></div>
        <span class="sp">${spark(load.slice(-8))}</span></div>
      ${ladderHtml(id, sets)}
      ${l.up ? `<span class="tag">Пора добавить вес → ${fmt(wt + e.step)} кг</span>` : ''}</div>`;
  }).join('');
  const days = ss.map(s => {
    const rows = DAYS[s.day].ex.filter(id => s.ex[id]).map(id => `<div class="dr">
      <div class="l"><span>${EX[id].n}</span>${delta(s.date, id, s.ex[id])}</div>
      <div class="s">${s.ex[id].map(setTxt).join(' · ')}</div></div>`).join('');
    return `<article class="day"><div class="dh"><b>${fmtDate(s.date)}</b><span class="sub">${DAYS[s.day].title}</span></div>${rows}</article>`;
  }).join('');
  const nSets = ss.reduce((a, s) => a + Object.values(s.ex).reduce((b, x) => b + x.length, 0), 0);
  return [`<div class="head"><h1>Прогресс</h1></div>
    <div class="stats">
      <div class="stat"><b>${streak}</b><span class="sub">нед. подряд</span></div>
      <div class="stat"><b>${ss.length}</b><span class="sub">тренировок</span></div>
      <div class="stat"><b>${nSets}</b><span class="sub">подходов</span></div>
    </div>
    <h2>Эта неделя</h2><div class="pills">${pills}</div>
    ${ss.length ? `<h2>Когда добавлять вес</h2>${cards}<h2>По дням</h2>${days}` : '<div class="empty">Пока пусто. Запиши первый подход — и он появится здесь.</div>'}`, tabsHtml('progress')];
};

let lastKey = '';
function render(keep) {
  const t = here(), key = JSON.stringify(t), view = $('#view');
  const [html, dock] = V[t.v](t);
  const y = view.scrollTop;
  view.innerHTML = html;
  $('#dock').innerHTML = timerHtml() + dock;
  if (keep && key === lastKey) view.scrollTop = y;
  else { view.scrollTop = 0; view.classList.remove('in'); void view.offsetWidth; view.classList.add('in'); }
  lastKey = key;
  if (inTg) nav.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  tick();
}

/* ---------- действия ---------- */
const ACT = {
  tab: d => tab(d.v),
  back,
  day: d => go('workout', {day: d.day}),
  ex: d => openEx(d.day, d.id),
  warm: d => go('warmup', {day: d.day}),
  startwarm: () => { startRest(300, 'Разминка'); render(true); },
  pref: d => { db.prefs.rest = +d.s; save('prefs', db.prefs); render(true); },
  step: d => {
    const e = EX[here().id], k = d.k, st = k === 'w' ? e.step : 1;
    const v = (Number.isFinite(ui.cur[k]) ? ui.cur[k] : 0) + d.d * st;
    ui.cur[k] = Math.max(k === 'r' ? 1 : 0, Math.round(v * 100) / 100);
    $('#in-' + k).value = fmt(ui.cur[k]);
    hap('light');
  },
  log: () => {
    const {day, id} = here(), e = EX[id], reps = Math.round(ui.cur.r), w = Number.isFinite(ui.cur.w) ? ui.cur.w : 0;
    if (!(reps > 0)) { $('#in-r').focus(); tg?.HapticFeedback?.notificationOccurred('error'); return; }
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    ac.resume?.();
    const key = sessKey(today(), day), s = db.s[key] ||= {date: today(), day, ex: {}};
    (s.ex[id] ||= []).push([w, reps]);
    save(key, s);
    const done = DAYS[day].ex.every(x => (s.ex[x]?.length || 0) >= EX[x].sets);
    done ? (rest = null, saveRest()) : startRest();
    ui.cur = suggest(day, id);
    hap('medium');
    render(true);
  },
  del: d => {
    const {day, id} = here(), key = sessKey(today(), day), s = db.s[key];
    s.ex[id].splice(+d.i, 1);
    if (!s.ex[id].length) delete s.ex[id];
    if (Object.keys(s.ex).length) save(key, s); else { delete db.s[key]; save(key, null); }
    ui.cur = suggest(day, id);
    render(true);
  },
  next: () => {
    const {day, id} = here(), list = DAYS[day].ex, i = list.indexOf(id);
    if (!id) return openEx(day, list[0], true);
    i < list.length - 1 ? openEx(day, list[i + 1], true) : back();
  },
  rest: d => {
    if (!rest) return;
    rest.end = Math.max(Date.now(), rest.end + d.d * 1000);
    rest.total = Math.max(1000, rest.total + d.d * 1000);
    rest.done = rest.end <= Date.now();
    saveRest(); tick();
  },
  skip: () => { rest = null; saveRest(); render(true); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b) ACT[b.dataset.a](b.dataset);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.in;
  if (k) ui.cur[k] = parseFloat(e.target.value.replace(',', '.'));
});
document.addEventListener('visibilitychange', tick);

/* ---------- старт ---------- */
function applyTheme() {
  if (inTg) document.documentElement.dataset.theme = tg.colorScheme;
  try {
    const [r, g, b] = getComputedStyle(document.body).backgroundColor.match(/\d+/g);
    const hex = '#' + [r, g, b].map(n => (+n).toString(16).padStart(2, '0')).join('');
    tg?.setHeaderColor(hex); tg?.setBackgroundColor(hex); tg?.setBottomBarColor?.(hex);
  } catch {}
}
if (tg) {
  tg.ready(); tg.expand();
  tg.disableVerticalSwipes?.();
  tg.BackButton.onClick(back);
  tg.onEvent('themeChanged', applyTheme);
}
applyTheme();
load().then(() => { render(); setInterval(tick, 250); });
</script>
</body>
</html>
