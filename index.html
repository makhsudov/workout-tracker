<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--surface:#f4f4f5;--line:#e4e4e7;--text:#111113;--sub:#6b6b73;--accent:#3d6bff;--accent-text:#2a55e6;--on-accent:#fff;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e10;--surface:#1a1a1d;--line:#2a2a2e;--text:#f4f4f5;--sub:#9a9aa3;--accent-text:#8ba6ff;--ok:#4ade80}}
:root[data-theme=dark]{--bg:#0e0e10;--surface:#1a1a1d;--line:#2a2a2e;--text:#f4f4f5;--sub:#9a9aa3;--accent-text:#8ba6ff;--ok:#4ade80}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:16px 16px 24px}
#view.in{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#dock{flex:none;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#dock:empty{display:none}

h1{font-size:26px;line-height:1.2;font-weight:700}
.eyebrow,.sub{font-size:13px;color:var(--sub)}
.sub{display:block}
.head{margin-bottom:20px}
.grow{flex:1;min-width:0}
.icon{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);flex:none}
.back{margin:-8px 0 4px -12px}

/* home */
.wcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px;margin-bottom:12px;border-radius:20px;background:var(--surface);transition:opacity .15s}
.wcard:active{opacity:.7}
.wt{display:block;font-weight:600;font-size:17px}
.chip{font-size:12px;font-weight:600;color:var(--accent-text);margin-left:6px}
.cal{margin-top:24px;background:var(--surface);border-radius:20px;padding:8px 8px 12px}
.ch{display:flex;align-items:center;text-align:center}
.ch b{display:block;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 4px;justify-items:center}
.cw{font-size:12px;color:var(--sub);padding-bottom:4px}
.cd{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums;color:var(--sub)}
.cd svg{width:18px;height:18px}
.cd.on{background:var(--ok);color:var(--bg)}
.cd.now{box-shadow:inset 0 0 0 2px var(--accent)}
.donev{text-align:center;padding-top:56px}
.donev .big{width:88px;height:88px;margin:0 auto 20px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center}
.donev .big svg{width:44px;height:44px}
.donev .stat{text-align:center}

/* workout list */
.note{background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--sub);margin-bottom:16px}
.ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line);min-height:72px}
.ex:active{opacity:.6}
.thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--surface);flex:none}
.thumb.warm{display:grid;place-items:center;color:var(--accent-text)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ex .nm{display:block;font-weight:600}
.cnt{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px;display:flex;align-items:center;gap:4px}
.cnt.ok{color:var(--ok)}

/* exercise */
.frames{position:relative;aspect-ratio:3/2;background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:16px}
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frames img+img{animation:swap 2.4s ease-in-out infinite}
@keyframes swap{0%,40%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
.wlist{padding-left:20px;margin:8px 0;color:var(--sub)}
.th{display:flex;align-items:center;gap:12px}
.vbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--accent-text);display:grid;place-items:center;flex:none}
.vbtn:active{opacity:.6}
.hint{background:var(--surface);border-radius:16px;padding:12px 16px;margin:16px 0;font-size:15px}
.hint b{color:var(--accent-text)}
.sets{display:grid;gap:8px;margin-bottom:16px}
.set{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 0 0 14px;border-radius:12px;border:1px solid var(--line);color:var(--sub);font-variant-numeric:tabular-nums}
.set .n{width:16px}
.set.done{color:var(--text);font-weight:600}
.set.done .ck{color:var(--ok);display:flex}
.set.now{border-color:var(--accent);color:var(--text)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.stepper{display:flex;align-items:center;background:var(--surface);border-radius:16px;height:64px}
.stepper button{width:44px;height:64px;display:grid;place-items:center;color:var(--accent-text);flex:none}
.stepper button:active{opacity:.5}
.stepper input{width:100%;min-width:0;text-align:center;font:inherit;font-size:24px;font-weight:700;background:none;border:0;color:inherit;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text)}
.seglabel{font-size:13px;color:var(--sub);margin-bottom:6px}

/* dock */
.bar{display:flex;gap:8px;padding:12px 16px}
.btn{flex:1;height:52px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.ghost{flex:none;background:var(--surface);color:var(--text)}
.tabs{display:flex}
.tabs button{flex:1;min-height:56px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--sub)}
.tabs button[aria-current=page]{color:var(--accent-text)}
.rest{padding:12px 16px 0}
.rt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.time{font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.rbtns{display:flex;gap:4px}
.rbtns button{min-width:48px;height:44px;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;display:grid;place-items:center}
.prog{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.rest.done .time{color:var(--ok)}
.rest.done .prog i{background:var(--ok)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.day{border-top:1px solid var(--line);padding:16px 0}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dh b{font-size:17px}
.dr{padding:6px 0}
.dr .l{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.dr .s{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.d.up{color:var(--ok)}
h2{font-size:18px;font-weight:700;margin:24px 0 8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:14px;border:1px solid var(--line);color:var(--sub);font-weight:600}
.pill .pk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.pill .pk svg{width:14px;height:14px}
.pill.ok{color:var(--text);border-color:var(--ok)}
.pill.ok .pk{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.pc{padding:14px 0;border-top:1px solid var(--line)}
.pc .nm{font-weight:600}
.pl{display:flex;align-items:center;gap:12px}
.sp{color:var(--accent-text);flex:none;display:flex}
.pc.up .sp{color:var(--ok)}
.spark{width:72px;height:28px;display:block}
.wchart{color:var(--accent-text);background:var(--surface);border-radius:16px;padding:16px 12px 12px;margin-bottom:20px}
.wchart .spark{width:100%;height:120px}
.wrow{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 0;border-top:1px solid var(--line)}
.wrow .wd{flex:none;width:96px}
.wrow .wv{font-weight:600;font-variant-numeric:tabular-nums}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pc.up .bar2 i{background:var(--ok)}
.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;border:1px solid var(--ok);color:var(--ok);font-size:13px;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:48px 0}

@media (prefers-reduced-motion:reduce){#view.in{animation:none}.frames img+img{animation:none;opacity:0}*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main><footer id="dock"></footer></div>
<script src="app.js"></script>
</body>
</html>
